[package]
name = "visage"
version = "0.1.0"
edition = "2021"
description = "parker's face — the fullscreen surface you talk to"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The engine and parker's verbs — every command body (main.rs header).
visage-door = { path = "../door" }
# Only to repair GTK's unset screen resolution before the webview reads it
# (sane_dpi in main.rs). The version tauri already pulls in, so it costs no
# extra compilation.
gtk = "0.18"

[profile.release]
lto = true
codegen-units = 1
