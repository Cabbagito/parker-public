[package]
name = "visage-door"
version = "0.1.0"
edition = "2021"
description = "visage's one door to the machine: the engine and parker's verbs, for any frame that hangs it"

# Two frames hang this door: the Tauri window on parker's own screen
# (../src-tauri) and the web server the tailnet reaches (../porthole). Neither
# carries a second copy of anything here (docs/visage/porthole/README.md).
[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
] }
